name: Hourly house checks

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      refresh_city24_mcp:
        description: Refresh City24 listings through its supported MCP instead of running other collectors
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: house-monitor-production
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
      CITY24_ENABLED: ${{ vars.CITY24_ENABLED || 'false' }}
      CITY24_MCP_ENABLED: "true"
      RENTINRIGA_ENABLED: ${{ vars.RENTINRIGA_ENABLED || 'false' }}
      LATIO_PERMISSION_CONFIRMED: ${{ vars.LATIO_PERMISSION_CONFIRMED || 'false' }}
      POLL_INTERVAL: "3600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_database tests.test_scheduled tests.test_store
      - if: ${{ inputs.refresh_city24_mcp != true }}
        run: python -m playwright install --with-deps chromium
      - if: ${{ inputs.refresh_city24_mcp == true }}
        run: python -m backend.city24_mcp_import
      - if: ${{ inputs.refresh_city24_mcp != true }}
        run: python -m backend.scheduled
