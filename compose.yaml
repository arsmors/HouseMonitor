services:
  house-monitor:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/monitor.db
      WEB_PASSWORD: ${WEB_PASSWORD:?Set a strong WEB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - monitor-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
volumes:
  monitor-data: